{% load static %}
<!DOCTYPE html>
<html lang="bn" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="AgriSmart AI — এআই-চালিত ফসলের রোগ শনাক্তকরণ প্ল্যাটফর্ম">
  <meta name="theme-color" content="#16a34a">
  <title>{% block title %}AgriSmart AI{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <!-- Django Messages -->
  {% if messages %}
  <div class="messages-container" id="messages-container">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }}" role="alert">
      <span>{{ message }}</span>
      <button class="close-btn" onclick="this.parentElement.remove()" aria-label="বন্ধ করুন">&times;</button>
    </div>
    {% endfor %}
  </div>
  {% endif %}

  {% block body %}{% endblock %}

  <script>
    // Auto-dismiss alerts after 5 seconds
    setTimeout(function(){
      var alerts=document.querySelectorAll('.alert');
      alerts.forEach(function(a){a.style.transition='opacity .5s';a.style.opacity='0';setTimeout(function(){a.remove()},500);});
    },5000);
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
